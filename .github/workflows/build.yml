name: Build Native Android C App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK (Android 11 - 16 / Full C)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Android SDK Platform 36 & 30
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platforms;android-30" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeC-Clock-WiFi-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
